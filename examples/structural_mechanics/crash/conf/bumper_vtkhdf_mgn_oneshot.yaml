# Overfit MeshGraphNet (one-shot) on a couple of VTKHDF bumper sims.
#
# This is a sanity check: with only a few samples and many epochs, the per-epoch avg_loss
# should drop toward ~0, confirming the data -> graph -> model -> loss -> step pipeline is
# wired correctly. (It does NOT prove the model learned the physics: global scalars are
# broadcast to every node and the structural-only mesh is disconnected, so memorization is
# easy. See VTKHDF_DATALOADER.md.)
#
# Needs the real PhysicsNeMo MeshGraphNet (torch>=2.10) -> run on Colab/GPU, not an Intel Mac.
#
# Usage:
#   python make_global_features.py
#   python train.py --config-name=bumper_vtkhdf_mgn_oneshot

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

experiment_name: "Bumper-VTKHDF-MGN-overfit"

defaults:
  - reader: vtkhdf
  - datapipe: graph
  - model: mgn_one_shot
  - training: default
  - inference: default
  - _self_

# ┌───────────────────────────────────────────┐
# │                   Data                    │
# └───────────────────────────────────────────┘

training:
  raw_data_dir: ./simulations             # reader filters to split=train via the master CSV
  raw_data_dir_validation: ./simulations
  global_features_filepath: ./global_features.json
  num_time_steps: 101

  # Overfit knobs
  num_training_samples: 2       # the "couple of data points"
  num_validation_samples: 0     # disable validation; watch the training avg_loss
  optimizer: adam
  start_lr: 1e-3                # bumped for a fast overfit
  end_lr: 1e-4                  # cosine decays start_lr -> end_lr over `epochs`; keep it up
  epochs: 2000
  amp: true                    # GPU; set training.amp=false for CPU-only runs

inference:
  raw_data_dir_test: ./simulations

# ┌───────────────────────────────────────────┐
# │            Datapipe features              │
# └───────────────────────────────────────────┘

datapipe:
  static_features: []   # override graph.yaml's default [thickness]: no per-node thickness in this data
  dynamic_features: []
  dynamic_targets:
    - effective_plastic_strain
    - stress_vm
  global_features:
    - velocity_x
    - thickness_scale
    - rwall_origin_y
  sample_type: all_time_steps

# ┌───────────────────────────────────────────┐
# │            Model overrides                │
# └───────────────────────────────────────────┘

model:
  input_dim_nodes: 6    # _cat_global = coords(3) + static_features(0) + global_features(3)
  input_dim_edges: 4    # dx, dy, dz, distance (from the graph datapipe)
  output_dim: 500       # (num_time_steps - 1) * (3 displacement + 2 dynamic_targets) = 100 * 5
  num_time_steps: ${training.num_time_steps}
