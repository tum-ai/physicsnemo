# DEC ablation — arm "ctx": DEC shape features enter ONLY through the
# geometry-context input (ContextProjector + multi-scale extractor; every GALE
# block cross-attends to the result). Compare against the baseline
# bumper_geotransolver_oneshot.yaml and the _dec_local / _dec_both arms with
# identical data, splits, and seeds.
# Usage: python train.py --config-name=bumper_geotransolver_oneshot_dec_ctx

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

experiment_name: "Bumper-GeoTransolver-DEC-ctx"

defaults:
  - reader: vtkhdf
  - datapipe: point_cloud
  - model: geotransolver_one_shot
  - training: default
  - inference: default
  - _self_

reader:
  dec_features: true

# ┌───────────────────────────────────────────┐
# │                   Data                    │
# └───────────────────────────────────────────┘

training:
  raw_data_dir: ???        # set in config or via CLI: training.raw_data_dir=/path/to/train
  raw_data_dir_validation: ???   # set in config or via CLI: training.raw_data_dir_validation=/path/to/validation
  global_features_filepath: ???  # set in config or via CLI: training.global_features_filepath=/path/to/global_features.json
  optimizer: muon

  num_time_steps: 101
  num_training_samples: 121
  num_validation_samples: 5

inference:
  raw_data_dir_test: ???         # set in config or via CLI: inference.raw_data_dir_test=/path/to/test

# ┌───────────────────────────────────────────┐
# │            Datapipe features              │
# └───────────────────────────────────────────┘

datapipe:
  static_features: []            # arm ctx: nothing extra in the fx stream
  geometry_features:             # → geometry = cat(coords, these) [N, 3+7]
    - dec_h_signed
    - dec_h_mag
    - dec_normal
    - dec_log_area
    - dec_is_boundary
  dynamic_targets: []   # coords-only: predict deformation, drop stress/strain
  global_features:
    - velocity_x
    - thickness_scale
    - rwall_origin_y
  sample_type: all_time_steps
  stats_dir: stats_dec_ctx       # feature dims differ from baseline → own stats

# ┌───────────────────────────────────────────┐
# │            Model overrides                │
# └───────────────────────────────────────────┘

model:
  functional_dim: 3   # coords (3) — fx unchanged in this arm
  geometry_dim: 10    # coords (3) + DEC features (7)
  out_dim: 300        # (num_time_steps - 1) * 3 = 100 * 3 (coords only)
  global_dim: 3       # must match len(datapipe.global_features)
  guard_config: null
