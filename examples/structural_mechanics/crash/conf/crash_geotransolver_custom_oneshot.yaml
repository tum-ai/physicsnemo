# Car body-in-white crash experiment using GeoTransolver (one-shot) with Custom BQ.
# Usage: python train.py --config-name=crash_geotransolver_custom_oneshot

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

experiment_name: "Car-Crash-GeoTransolver-CustomBQ"

defaults:
  - reader: vtkhdf_stripped
  - datapipe: point_cloud
  - model: geotransolver_custom_oneshot
  - training: default
  - inference: default
  - _self_

# ┌───────────────────────────────────────────┐
# │                   Data                    │
# └───────────────────────────────────────────┘

training:
  raw_data_dir: ???              # set in config or via CLI: training.raw_data_dir=/path/to/train
  raw_data_dir_validation: ???   # set in config or via CLI: training.raw_data_dir_validation=/path/to/validation
  global_features_filepath: null # no per-run global scalars for this dataset
  optimizer: muon

  # ┌───────────────────────────────────────────┐
  # │                 Dataset                   │
  # └───────────────────────────────────────────┘

  num_time_steps: 17
  num_training_samples: 135
  num_validation_samples: 8

inference:
  raw_data_dir_test: ???         # set in config or via CLI: inference.raw_data_dir_test=/path/to/test

# ┌───────────────────────────────────────────┐
# │            Datapipe features              │
# └───────────────────────────────────────────┘

datapipe:
  static_features: []
  dynamic_targets: []   # position-only targets; no extra per-node time series
  global_features: null
  sample_type: all_time_steps

# ┌───────────────────────────────────────────┐
# │            Model overrides                │
# └───────────────────────────────────────────┘

model:
  functional_dim: 3   # coords (3) only
  out_dim: 48        # (num_time_steps - 1) * 3 = 16 * 3
  global_dim: null    # no global features for this dataset
  n_layers: 5         # memory bottleneck for this dataset
  
  # Override custom_bq_cls here if you want to use a different class.
  # Using `_partial_: true` is recommended so the wrapper can instantiate it with scale-specific parameters.
  # custom_bq_cls:
  #   _target_: my_custom_package.MyCustomBQClass
  #   _partial_: true
